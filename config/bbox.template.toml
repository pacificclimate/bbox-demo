[webserver]
loglevel = "Warn"

[webserver.cors]
allow_all_origins = true

[[datasource]]
name = "postgis_db"
[datasource.postgis]
url = "${BBOX_DB_DSN}"

[[collection]]
name = "lakes"
title = "Lakes"
description = "Lake features"
[collection.postgis]
datasource = "postgis_db"
sql = """
SELECT 
    Uid, 
    SubId,
    DowSubId,
    ST_AsGeoJSON(ST_SetSRID(geom, 3005)) AS geojson 
FROM lakes 
"""
fid_field = "subid"
geometry_field = "geojson"
queryable_fields = ["uid","subid","dowsubid"]

[[collection]]
name = "rivers"
title = "Rivers"
description = "Rivers Features"
[collection.postgis]
datasource = "postgis_db"
sql = """
SELECT 
    Uid, 
    SubId, 
    IsLake, 
    DowSubId, 
    ST_AsGeoJSON(ST_SetSRID(geom, 3005)) AS geojson 
FROM rivers 
"""
fid_field = "subid"
geometry_field = "geojson"
queryable_fields = ["uid","subid","dowsubid"]

[[collection]]
name = "upstreams"
title = "Upstreams"
description = "Upstream Watershed Features"
[collection.postgis]
datasource = "postgis_db"
sql = """
SELECT 
    subid,
    upstream_uids,
    upstream_subids,
    origin
FROM upstreams
"""
fid_field = "subid"
geometry_field = "origin"
queryable_fields = ["subid"]

[[collection]]
name="downstreams"
title="Downstreams"
description="Downstream Path Features"
[collection.postgis]
datasource="postgis_db"
sql = """
SELECT
    subid,
    downstream_uids,
    downstream_subids,
    mouth
FROM downstreams
"""
fid_field = "subid"
geometry_field = "mouth"
queryable_fields = ["subid"]

[[collection]]
name = "upstream_feature_collections"
title = "Upstream Network FeatureCollections"
description = "Downloadable river and lake FeatureCollections for upstream networks"
[collection.postgis]
datasource = "postgis_db"
sql = """
SELECT
    network.subid,
    network.origin,
    (
        SELECT jsonb_build_object(
            'type', 'FeatureCollection',
            'features', COALESCE(
                jsonb_agg(
                    jsonb_build_object(
                        'type', 'Feature',
                        'id', water.subid::text,
                        'geometry', ST_AsGeoJSON(ST_SetSRID(water.geom, 3005))::jsonb,
                        'properties', jsonb_build_object(
                            'subid', water.subid,
                            'uid', water.uid,
                            'dowsubid', water.dowsubid,
                            'islake', water.islake,
                            'source', water.source
                        )
                    ) ORDER BY member.position
                ),
                '[]'::jsonb
            )
        )
        FROM unnest(network.upstream_subids)
            WITH ORDINALITY AS member(subid, position)
        JOIN LATERAL (
            SELECT subid, uid, dowsubid, islake, 'river' AS source, geom
            FROM rivers
            WHERE subid = member.subid
            UNION ALL
            SELECT subid, uid, dowsubid, islake, 'lake' AS source, geom
            FROM lakes
            WHERE subid = member.subid
        ) water ON TRUE
    ) AS feature_collection
FROM upstreams network
"""
fid_field = "subid"
geometry_field = "origin"
queryable_fields = ["subid"]

[[collection]]
name = "downstream_feature_collections"
title = "Downstream Network FeatureCollections"
description = "Downloadable river and lake FeatureCollections for downstream networks"
[collection.postgis]
datasource = "postgis_db"
sql = """
SELECT
    network.subid,
    network.mouth,
    (
        SELECT jsonb_build_object(
            'type', 'FeatureCollection',
            'features', COALESCE(
                jsonb_agg(
                    jsonb_build_object(
                        'type', 'Feature',
                        'id', water.subid::text,
                        'geometry', ST_AsGeoJSON(ST_SetSRID(water.geom, 3005))::jsonb,
                        'properties', jsonb_build_object(
                            'subid', water.subid,
                            'uid', water.uid,
                            'dowsubid', water.dowsubid,
                            'islake', water.islake,
                            'source', water.source
                        )
                    ) ORDER BY member.position
                ),
                '[]'::jsonb
            )
        )
        FROM unnest(network.downstream_subids)
            WITH ORDINALITY AS member(subid, position)
        JOIN LATERAL (
            SELECT subid, uid, dowsubid, islake, 'river' AS source, geom
            FROM rivers
            WHERE subid = member.subid
            UNION ALL
            SELECT subid, uid, dowsubid, islake, 'lake' AS source, geom
            FROM lakes
            WHERE subid = member.subid
        ) water ON TRUE
    ) AS feature_collection
FROM downstreams network
"""
fid_field = "subid"
geometry_field = "mouth"
queryable_fields = ["subid"]

[[collection]]
name = "import_status"
title = "CHYP import status"
description = "Completed CHYP data imports"
[collection.postgis]
datasource = "postgis_db"
sql = """
SELECT
    import_id,
    status,
    river_count,
    lake_count,
    ST_AsGeoJSON(ST_SetSRID(ST_Point(52.628, -118.430), 3005)) AS geojson
FROM chyp_import_status
WHERE status = 'ready'
"""
fid_field = "import_id"
geometry_field = "geojson"
queryable_fields = ["import_id", "status"]

[[grid]]
json = "assets/BCAlbersCustomGrid.json"

[[tileset]]
name = "water_tiles"

[[tileset.cache_control]]
max_age = 86400 # Cache for 1 day
minzoom = 0
maxzoom = 12

[[tileset.tms]]
id = "BCAlbersCustomGrid"

[tileset.postgis]
datasource = "postgis_db"
extent = [217522, 376304, 5660707, 4543560]

# Rivers Layer
[[tileset.postgis.layer]]
name = "rivers"
geometry_type = "LINESTRING"

[[tileset.postgis.layer.query]]
sql = """
  SELECT  Uid, SubId, DowSubId, ST_SetSRID(geom, 3005) AS geom
  FROM rivers
  WHERE geom && ST_MakeEnvelope($1, $2, $3, $4, 3005)
"""

# Lakes Layer
[[tileset.postgis.layer]]
name = "lakes"
geometry_type = "POLYGON"

[[tileset.postgis.layer.query]]
sql = """
  SELECT Uid, SubId, IsLake, ST_SetSRID(geom, 3005) AS geom
  FROM lakes
  WHERE geom && ST_MakeEnvelope($1, $2, $3, $4, 3005)
"""
